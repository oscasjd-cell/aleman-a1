>En alemán el pronombre sujeto <b>es obligatorio</b>: en español decimos «vengo», en alemán siempre <b>Ich komme</b>. Cuidado: <b>sie</b> puede ser «ella», «ellos/ellas» y, con mayúscula, <b>Sie</b> = «usted/ustedes».

@art|u2|Artículos der/die/das y el género
>El alemán tiene <b>3 géneros</b>: <span class="m">der</span> (masculino), <span class="f">die</span> (femenino), <span class="n">das</span> (neutro). En plural siempre <span class="f">die</span>. ¡El género no coincide con el español! (la mesa → <b>der</b> Tisch). Aprende cada sustantivo con su artículo. Los sustantivos se escriben siempre con <b>mayúscula</b>.

function plain(s){return s.replace(/[*_]/g,"")}
function mark(s){return s.replace(/\*(.+?)\*/g,'<span class="v">$1</span>').replace(/_(.+?)_/g,'<span class="e">$1</span>')}
const FRASES=FRAW.trim().split("\n").map(l=>{const f=l.split("|");return{u:f[0],de:f[1],es:f[2],pr:f[3]}});
st.g=st.g||{};const gres=t=>st.g[t.id]||(st.g[t.id]={});
function gProg(t){const r=gres(t);const ok=t.ex.filter(x=>r[x.id]==1).length;return ok}
const qa2=s=>s.replace(/"/g,"&quot;");
function gList(){let h="<h2>Gramática</h2><p class='small'>Leyenda: <span class='v'>verbo conjugado</span> · <span class='e'>parte al final de la frase</span> · <span class='m'>der</span> <span class='f'>die</span> <span class='n'>das</span></p>";
Object.keys(UNAMES).forEach(u=>{const ts=TOPICS.filter(t=>t.unit==u);if(!ts.length)return;h+=`<h3>${UNAMES[u]}</h3>`+ts.map(t=>{const p=gProg(t);return`<button class="btn opt" data-t="${t.id}">${t.title}<br><span class="small">${p}/${t.ex.length} ejercicios correctos ${p==t.ex.length?"✅":""}</span><div class="bar"><i style="width:${100*p/t.ex.length}%"></i></div></button>`}).join("")});
$("#gC").innerHTML=h}
$("#gC").onclick=e=>{const b=e.target.closest("[data-t]");if(b)gTopic(TOPICS.find(t=>t.id==b.dataset.t))};
let GT=null,GQ=[],GI=0;
function gTopic(t){GT=t;let h=`<button class="btn sec" id="gBack">‹ Volver a temas</button><h2>${t.title}</h2>`;
t.items.forEach(it=>{if(it.p)h+=`<p>${it.p}</p>`;else h+=`<div class="tw"><table>${it.t.map((r,i)=>"<tr>"+r.map(c=>i?`<td>${c}</td>`:`<th>${c}</th>`).join("")+"</tr>").join("")}</table></div>`});
h+="<h3>Ejemplos</h3>"+t.eg.map(e=>`<div class="li"><div><b style="font-size:1.1rem">${mark(e.de)}</b>${e.es}<div class="pr" style="font-size:.95rem">[${e.pr}]</div></div><button class="spk" data-s="${qa2(plain(e.de))}">🔊</button></div>`).join("");
h+=`<h3>Ejercicios (${t.ex.length})</h3><div class="row"><button class="btn" id="gStart">▶ Empezar / repetir ejercicios</button><button class="btn sec" id="gWrong">Solo los fallados</button></div><div id="gX"></div>`;
$("#gC").innerHTML=h;window.scrollTo(0,0);$("#gBack").onclick=gList;
$("#gStart").onclick=()=>gRun(shuf(t.ex));$("#gWrong").onclick=()=>{const r=gres(t);const w=t.ex.filter(x=>r[x.id]!=1);w.length?gRun(shuf(w)):($("#gX").innerHTML="<p>🎉 ¡No tienes ejercicios pendientes!</p>")}}
$("#gC").addEventListener("click",e=>{if(e.target.dataset.s)say(e.target.dataset.s)});
function gRun(list){GQ=list;GI=0;gShow()}
function gDone(x,ok,extra){const r=gres(GT);r[x.id]=ok?1:0;save();
$("#gF").innerHTML=(ok?"<b style='color:var(--ok)'>✅ ¡Correcto!</b>":"<b style='color:var(--bad)'>❌ Incorrecto.</b> Respuesta: <b>"+x.a+"</b>")+"<br>"+x.why+(extra||"")+`<br><button class="btn" id="gN" style="margin-top:8px;width:100%">Siguiente ›</button>`;$("#gN").onclick=()=>{GI++;gShow()}}
function gShow(){const x=GQ[GI],box=$("#gX");if(!x){const p=gProg(GT);box.innerHTML=`<div class="card"><b>Fin de la ronda.</b> Llevas ${p}/${GT.ex.length} correctos en este tema.</div>`;return}
let h=`<div class="card"><p class="small">Ejercicio ${GI+1}/${GQ.length} · ${{fill:"Completa",mc:"Traduce al alemán",order:"Ordena la frase"}[x.type]}</p>`;
if(x.type=="fill"){h+=`<div class="es"><b>${x.q.replace("___","<u>&nbsp;?&nbsp;</u>")}</b></div><div id="gO"></div>`}
else if(x.type=="mc"){h+=`<div class="es"><b>${x.q}</b></div><div id="gO"></div>`}
else{h+=`<div class="es">${x.q}</div><div id="gAns" class="ans"></div><div id="gPool" class="pool"></div><div class="row"><button class="btn sec" id="gClr">Borrar</button><button class="btn" id="gChk">Comprobar</button></div>`}
box.innerHTML=h+`<div id="gF" class="small" style="margin-top:8px"></div></div>`;
if(x.type!="order"){shuf([x.a,...x.w]).forEach(o=>{const b=document.createElement("button");b.className="btn opt";b.textContent=o;b.onclick=()=>{if($("#gF").innerHTML)return;const ok=o==x.a;b.classList.add(ok?"right":"wrong");[...$("#gO").children].forEach(c=>{if(c.textContent==x.a)c.classList.add("right")});
const full=x.type=="fill"?x.q.replace(/\s*\(.*?\)\s*$/,"").replace(/^.*→\s*/,"").replace("___",x.a):x.a;gDone(x,ok,x.type=="fill"&&/[a-zäöü]/i.test(full)?`<br>🔊 <a href="#" id="gSay">${full}</a>`:`<br>🔊 <a href="#" id="gSay">${full}</a>`);$("#gSay").onclick=ev=>{ev.preventDefault();say(full)};say(full)};$("#gO").appendChild(b)})}
else{const toks=x.a.split(" ");let picked=[];const pool=shuf(toks.map((w,i)=>({w,i})));if(pool.map(p=>p.w).join(" ")==x.a&&toks.length>1)pool.push(pool.shift());
const draw=()=>{$("#gAns").innerHTML=picked.map(p=>`<span class="tok on">${p.w}</span>`).join(" ")||"<span class='small'>Toca las palabras en orden…</span>";$("#gPool").innerHTML="";pool.forEach(p=>{if(picked.includes(p))return;const s=document.createElement("button");s.className="tok";s.textContent=p.w;s.onclick=()=>{if($("#gF").innerHTML)return;picked.push(p);draw()};$("#gPool").appendChild(s)})};draw();
$("#gClr").onclick=()=>{if(!$("#gF").innerHTML){picked=[];draw()}};$("#gChk").onclick=()=>{if($("#gF").innerHTML||picked.length<toks.length)return;const ok=picked.map(p=>p.w).join(" ")==x.a;gDone(x,ok,`<br>[${x.pr}]`);say(x.a)}}}
// frases
function fList(){const q=norm($("#fq").value||"");const all=[...TOPICS.flatMap(t=>t.eg.map(e=>({u:t.unit,de:plain(e.de),es:e.es,pr:e.pr}))),...FRASES];
$("#frL").innerHTML=Object.keys(UNAMES).map(u=>{const fs=all.filter(f=>f.u==u&&(!q||norm(f.de+" "+f.es).includes(q)));return fs.length?`<h3>${UNAMES[u]} (${fs.length})</h3>`+fs.map(f=>`<div class="li"><div><b>${f.de}</b>${f.es}<div class="pr" style="font-size:.95rem">[${f.pr}]</div></div><button class="spk" data-s="${qa2(f.de)}">🔊</button></div>`).join(""):""}).join("");$("#frN").textContent=all.length}
$("#fq").oninput=fList;$("#frL").onclick=e=>{if(e.target.dataset.s)say(e.target.dataset.s)};

try{if(!window.__built)build()}catch(e){window.__showErr&&window.__showErr("Inicio: "+e.message)}
try{if("serviceWorker"in navigator&&location.protocol!="file:")navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}
</script></body></html>
